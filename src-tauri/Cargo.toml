[package]
name = "video2gif"
version = "1.0.0"
description = "Video2GIF — Tauri 2 desktop app"
authors = ["ledshic"]
edition = "2021"

[lib]
name = "video2gif_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
video-sdk = { path = "../crates/video-sdk" }
parking_lot = "0.12"
once_cell = "1"

